<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab Volume Booster</title>
  <style>
    :root {
      color-scheme: light dark;
      --border: light-dark(#aeb7c3, #50555f);
      --accent: light-dark(#2456a3, #a8c7ff);
    }
    body {
      margin: 0;
      box-sizing: border-box;
      width: 288px;
      padding: 12px;
      background: light-dark(#ffffff, #17191e);
      color: light-dark(#20242b, #fafafa);
      font: 14px/1.4 system-ui, sans-serif;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      flex: 1;
      font-weight: 600;
    }
    output {
      font-variant-numeric: tabular-nums;
    }
    input {
      width: 100%;
      margin: 12px 0;
      accent-color: var(--accent);
    }
    button {
      border: 1px solid var(--border);
      border-radius: 5px;
      background: light-dark(#eef1f5, #22252c);
      color: inherit;
      padding: 3px 8px;
      font: inherit;
    }
    button:enabled {
      cursor: pointer;
    }
    button:enabled:hover {
      background: light-dark(#e1e6ed, #363c48);
    }
    button:disabled {
      opacity: 0.55;
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    [role="status"] {
      color: light-dark(#4b5563, #d2d5de);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="row">
    <label for="level">Volume boost</label>
    <output id="value" for="level">100%</output>
  </div>
  <input id="level" type="range" min="0" max="600" step="5" value="100" aria-valuetext="100%">
  <div class="row">
    <button id="reset" type="button" disabled>Reset</button>
    <span id="status" role="status"></span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
